<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Banner — Yashraj Singh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 600px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: #FAFAF8;
      position: relative;
    }
    .cloud {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 80% at 50% 100%, rgba(0,0,0,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(0,0,0,0.02) 0%, transparent 50%);
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 2px 24px rgba(0,0,0,0.06);
      margin-bottom: 40px;
    }
    .dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #0A0A0A;
      text-align: center;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .cta {
      margin-top: 36px;
      background: #0A0A0A;
      color: #FAFAF8;
      padding: 16px 36px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="cloud"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span> Available for New Project</div>
    <h1>Have a project<br>in mind?</h1>
    <div class="cta">Contact Me ↗</div>
  </div>
</body>
</html>

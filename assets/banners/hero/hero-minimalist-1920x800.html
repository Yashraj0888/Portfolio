<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Banner — Yashraj Singh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 800px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: #FAFAF8;
      position: relative;
    }
    .watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 280px;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(10,10,10,0.06);
      pointer-events: none;
      white-space: nowrap;
    }
    .gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(10,10,10,0.04) 0%, transparent 70%);
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 2px 24px rgba(0,0,0,0.06);
      margin-bottom: 48px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #10B981;
      border-radius: 50%;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 72px;
      font-weight: 800;
      color: #0A0A0A;
      text-align: center;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    p {
      margin-top: 24px;
      font-size: 20px;
      color: #6B6B6B;
      text-align: center;
      max-width: 520px;
      line-height: 1.6;
    }
    .cta {
      margin-top: 40px;
      background: #0A0A0A;
      color: #FAFAF8;
      padding: 16px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="gradient"></div>
  <div class="watermark">YASHRAJ</div>
  <div class="content">
    <div class="badge"><span class="dot"></span> Available for New Project</div>
    <h1>Full-Stack Developer</h1>
    <p>Building digital products that are clear, scalable, and conversion-focused.</p>
    <div class="cta">Let's collaborate ↗</div>
  </div>
</body>
</html>
